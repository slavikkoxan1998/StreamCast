{% extends "base.html" %}
{% block title %}Password — StreamCast{% endblock %}
{% block body %}
<div class="login-wrap">
  <div class="login-card">
    <div class="brand"><span class="dot"></span>StreamCast</div>
    <p class="subtitle">{{ 'Change master password' if u_id is none else 'Change your password' }}</p>
    <form method="post">
      <div class="field">
        <label for="current">Current password</label>
        <input type="password" id="current" name="current" required autocomplete="current-password">
      </div>
      <div class="field">
        <label for="new">New password</label>
        <input type="password" id="new" name="new" required minlength="6" autocomplete="new-password">
      </div>
      <div class="field">
        <label for="confirm">Repeat new password</label>
        <input type="password" id="confirm" name="confirm" required minlength="6" autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">Update password</button>
    </form>
  </div>
</div>
{% endblock %}
